<script>
  const particlesEl = document.getElementById('particles');
  const sizes = ['s', 's', 's', 'm', 'm', 'l'];
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    const size = sizes[Math.floor(Math.random() * sizes.length)];
    p.className = 'particle ' + size;
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 20 + 's';
    p.style.animationDuration = (10 + Math.random() * 12) + 's';
    particlesEl.appendChild(p);
  }

  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // ============ RADAR ============
  (function(){
    const cv = document.getElementById('radarCanvas');
    if(!cv) return;
    const ctx = cv.getContext('2d');
    const W=620, CX=310, CY=310, RMAX=268, TAU=Math.PI*2, SPEED=0.0028;

    const TIER_R={cmd:130, off:130, grd:130, cdt:130, all:130};

    const PLAYERS=[
      {nick:'egorkochman', tier:'all'},
      {nick:'MaloyGnoy', tier:'all'},
      {nick:'Leps_on_TV', tier:'all'},
      {nick:'gggk303', tier:'all'},
      {nick:'Alex_DeviL777', tier:'all'},
      {nick:'Wit163rus', tier:'all'},
      {nick:'Yaruy_K', tier:'all'},
      {nick:'PoznyakAlexDi', tier:'all'},
      {nick:'Tima-ma', tier:'all'},
      {nick:'Roman_WOW_', tier:'all'},
      {nick:'Checkmatic', tier:'all'},
      {nick:'mcbay1988', tier:'all'},
      {nick:'Alexander-VIII', tier:'all'},
      {nick:'CEPbIU_76', tier:'all'},
      {nick:'Evgeniy_Ivshin', tier:'all'},
      {nick:'Alex_Messer', tier:'all'},
      {nick:'Prado_VOD', tier:'all'},
      {nick:'Naikon71', tier:'all'},
      {nick:'F0K1CH', tier:'all'},
      {nick:'Super-zverugin', tier:'all'},
      {nick:'BaLTaZaR014', tier:'all'},
      {nick:'ZEMJI9IHUH', tier:'all'},
      {nick:'komawars', tier:'all'},
      {nick:'dimonlamo', tier:'all'},
      {nick:'RoskeA-RoBBi', tier:'all'},
      {nick:'isaev_denis', tier:'all'},
      {nick:'Dennazzz', tier:'all'},
      {nick:'Intrepids7', tier:'all'},
      {nick:'FenomenRostov', tier:'all'},
      {nick:'BursAssassin', tier:'all'},
      {nick:'ChestorQQ_RU', tier:'all'},
      {nick:'OziSchneider', tier:'all'},
      {nick:'GOLDBERG475', tier:'all'},
      {nick:'devasator91', tier:'all'},
      {nick:'lucky292pear', tier:'all'},
      {nick:'OziBlitz', tier:'all'},
      {nick:'Xolod', tier:'all'},
      {nick:'vsegda-buhoy', tier:'all'},
      {nick:'vladimir_chevere', tier:'all'},
      {nick:'sagoyakov_roman', tier:'all'},
      {nick:'Fufic-92', tier:'all'},
      {nick:'Aerilou', tier:'all'},
      {nick:'Mrwhitevoron', tier:'all'},
      {nick:'Redvoin_RF', tier:'all'},
      {nick:'SharOn_RU', tier:'all'}
    ];

    function norm(a){let x=a%TAU;return x<0?x+TAU:x;}

    const dots=[];
    const n=PLAYERS.length;
    const r0=124, r1=176;
    const n0=Math.ceil(n/2), n1=Math.floor(n/2);

    // Сначала раскладываем все точки по углу на одном виртуальном кольце,
    // затем чётные/нечётные разводим на r0/r1.
    // Так угловые позиции строго чередуются и группы тоже строго чередуются.
    PLAYERS.forEach((p,idx)=>{
      const inner=(idx%2===0);
      const r=inner?r0:r1;
      // Все 45 точек равномерно по углу — не парами, а одной лентой
      const ang=norm(-Math.PI/2 + (idx/n)*TAU);
      const rv=r+(Math.random()-0.5)*5;
      dots[idx]={
        x:CX+rv*Math.cos(ang), y:CY+rv*Math.sin(ang),
        angle:ang, nick:p.nick, tier:'all',
        bright:0, revealed:false,
        group:idx%3,
      };
    });

    // Ручные корректировки позиций
    dots.forEach(d=>{
      if(d.nick==='egorkochman'){
        const ang=d.angle+0.14;
        const r=90;
        d.x=CX+r*Math.cos(ang); d.y=CY+r*Math.sin(ang);
        d.angle=ang;
      }
      if(d.nick==='Wit163rus'){
        const ang=d.angle+0.42;
        const r=Math.hypot(d.x-CX, d.y-CY);
        d.x=CX+r*Math.cos(ang); d.y=CY+r*Math.sin(ang);
        d.angle=ang;
      }
      if(d.nick==='RoskeA-RoBBi'){
        // чуть центрее — уменьшаем радиус
        const ang=d.angle;
        const r=105;
        d.x=CX+r*Math.cos(ang); d.y=CY+r*Math.sin(ang);
      }
      if(d.nick==='Wit163rus'){
        const ang=d.angle;
        const r=200;
        d.x=CX+r*Math.cos(ang); d.y=CY+r*Math.sin(ang);
        d.group=1;
      }
      if(d.nick==='Mrwhitevoron'){
        const ang=d.angle+0.18;
        const r=Math.hypot(d.x-CX, d.y-CY);
        d.x=CX+r*Math.cos(ang); d.y=CY+r*Math.sin(ang);
        d.angle=ang;
      }
      if(d.nick==='BaLTaZaR014'){
        const ang=d.angle+0.16;
        const r=Math.hypot(d.x-CX, d.y-CY);
        d.x=CX+r*Math.cos(ang); d.y=CY+r*Math.sin(ang);
        d.angle=ang;
      }
    });
    function nickPos(d){
      const NW=d.nick.length*6.2;
      const PAD=30;
      const qx=d.x>CX?1:-1;
      const qy=d.y>CY?1:-1;
      let tx=d.x+qx*10;
      let ty=d.y+qy*13;
      const anchor=qx>0?'left':'right';
      if(anchor==='left'){ if(tx+NW>W-PAD) tx=W-PAD-NW; }
      else               { if(tx-NW<PAD)   tx=PAD+NW;   }
      ty=Math.max(PAD+10, Math.min(W-PAD, ty));
      return{tx,ty,anchor};
    }

    let sweep=norm(-Math.PI/2+0.7), totalAngle=0;
    const TOTAL=4;

    function reset(){
      totalAngle=0; sweep=norm(-Math.PI/2+0.7);
      dots.forEach(d=>{d.bright=0;d.revealed=false;});
    }

    function drawBg(){
      ctx.clearRect(0,0,W,W);
      [52,108,166,224,268].forEach((r,i)=>{
        ctx.beginPath();ctx.arc(CX,CY,r,0,TAU);
        ctx.strokeStyle=i===4?'#c9a04a':'#243040';
        ctx.lineWidth=i===4?1.2:0.5;ctx.stroke();
      });
      [[CX-272,CY,CX+272,CY],[CX,CY-272,CX,CY+272],
       [CX-193,CY-193,CX+193,CY+193],[CX+193,CY-193,CX-193,CY+193]
      ].forEach(([x1,y1,x2,y2])=>{
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
        ctx.strokeStyle='#243040';ctx.lineWidth=0.4;ctx.stroke();
      });
      for(let i=0;i<36;i++){
        const a=(i/36)*TAU, len=i%9===0?10:i%3===0?6:3;
        ctx.beginPath();
        ctx.moveTo(CX+Math.cos(a)*268,CY+Math.sin(a)*268);
        ctx.lineTo(CX+Math.cos(a)*(268-len),CY+Math.sin(a)*(268-len));
        ctx.strokeStyle='#c9a04a';ctx.lineWidth=0.6;ctx.stroke();
      }
      ctx.font='bold 11px monospace';ctx.fillStyle='#d4a849';
      ctx.textAlign='center';ctx.fillText('N',CX,CY-276);ctx.fillText('S',CX,CY+287);
      ctx.textAlign='left'; ctx.fillText('E',CX+278,CY+4);
      ctx.textAlign='right';ctx.fillText('W',CX-275,CY+4);
      ctx.beginPath();ctx.arc(CX,CY,3,0,TAU);ctx.fillStyle='#d4a849';ctx.fill();

      const pass=Math.floor(totalAngle/TAU)+1;
      const pct=Math.min(100,Math.round(((totalAngle%TAU)/TAU)*100));
      ctx.font='9px monospace';ctx.fillStyle='#2a3a48';ctx.textAlign='left';
      ctx.fillText('SCAN '+Math.min(pass,TOTAL)+'/'+TOTAL+'  '+pct+'%',CX-260,CY+263);
    }

    function drawSweep(){
      const TRAIL=Math.PI*0.55, STEPS=20;
      for(let i=0;i<STEPS;i++){
        const a0=sweep-TRAIL*(1-i/STEPS);
        const a1=sweep-TRAIL*(1-(i+1)/STEPS);
        const t=(i+1)/STEPS;
        ctx.save();ctx.beginPath();ctx.moveTo(CX,CY);
        ctx.arc(CX,CY,RMAX,a0,a1);ctx.closePath();
        ctx.fillStyle='rgba(212,168,73,'+(t*t*0.13)+')';
        ctx.fill();ctx.restore();
      }
      ctx.beginPath();ctx.moveTo(CX,CY);
      ctx.lineTo(CX+Math.cos(sweep)*RMAX,CY+Math.sin(sweep)*RMAX);
      ctx.strokeStyle='rgba(212,168,73,0.88)';ctx.lineWidth=1.2;ctx.stroke();
    }

    function drawDots(){
      dots.forEach(d=>{
        if(d.bright<0.01)return;
        const a=d.bright;
        ctx.save();ctx.globalAlpha=a*0.15;
        ctx.beginPath();ctx.arc(d.x,d.y,12,0,TAU);
        ctx.fillStyle='#d4a849';ctx.fill();ctx.restore();
        ctx.save();ctx.globalAlpha=a;
        ctx.beginPath();ctx.arc(d.x,d.y,3,0,TAU);
        ctx.fillStyle='#d4a849';ctx.fill();ctx.restore();
        if(a<0.08)return;
        const {tx,ty,anchor}=nickPos(d);
        ctx.save();ctx.globalAlpha=a*0.92;
        ctx.font='10px monospace';ctx.fillStyle='#d4a849';
        ctx.textAlign=anchor;ctx.fillText(d.nick,tx,ty);
        ctx.restore();
      });
    }

    function frame(){
      sweep=norm(sweep+SPEED);
      totalAngle+=SPEED;
      if(totalAngle>=TAU*TOTAL+0.01){reset();return requestAnimationFrame(frame);}

      const passes=totalAngle/TAU;
      dots.forEach(d=>{
        const lo=d.group, hi=d.group+1;
        const canReveal=passes>=lo&&passes<hi;
        const diff=norm(d.angle-sweep);
        const onBeam=diff<0.07||diff>TAU-0.015;

        if(onBeam&&canReveal&&!d.revealed){ d.revealed=true; }

        if(d.revealed){
          if(onBeam&&canReveal) d.bright=Math.min(1,d.bright+0.08);
          else                  d.bright=Math.max(0,d.bright-0.0008);
        }
      });

      drawBg();drawSweep();drawDots();
      requestAnimationFrame(frame);
    }

    // запускаем только когда секция попадает в viewport
    const radarObs=new IntersectionObserver(entries=>{
      if(entries[0].isIntersecting){ radarObs.disconnect(); frame(); }
    },{threshold:0.2});
    radarObs.observe(cv);
  })();
</script>
